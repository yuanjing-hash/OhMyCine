name: Player CI

on:
  push:
    branches: [main, develop]
    paths:
      - "player/**"
      - ".github/workflows/player.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "player/**"
      - ".github/workflows/player.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: player/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify scraper classification
        run: npm run verify:scraper

      - name: Verify OpenList/Alist auth recovery
        run: npm run verify:alist-auth-recovery

      - name: Verify home fault isolation
        run: npm run verify:home-fault-isolation

      - name: Verify aggregate search fault isolation
        run: npm run verify:home-aggregate-search

      - name: Verify raw source index scheduler
        run: npm run verify:raw-source-index-scheduler

      - name: Verify 123 Pan datasource
        run: npm run verify:pan123-datasource

      - name: Verify TMDB auth routing
        run: npm run verify:tmdb-auth

      - name: Verify window fullscreen and resize synchronization
        run: npm run verify:window-fullscreen-resize

      - name: Verify subtitle search routing and security boundaries
        run: npm run verify:subtitle-search

      - name: Verify signed updater channels and release artifacts
        run: npm run verify:auto-update

  rust-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: player/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri and libmpv dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: player/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test native Linux Rust target
        working-directory: player/src-tauri
        run: cargo test --lib

      - name: Check native Linux Rust targets
        working-directory: player/src-tauri
        run: cargo check --all-targets

  rust-windows-msvc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: player

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: player/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: player/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows libmpv runtime and import libraries
        run: npm run setup:libmpv -- windows

      - name: Build frontend
        run: npm run build

      - name: Test native Windows MSVC Rust target
        working-directory: player/src-tauri
        run: cargo test --lib

      - name: Check native Windows MSVC Rust targets
        working-directory: player/src-tauri
        run: cargo check --all-targets

  build:
    needs: [quality, rust-linux, rust-windows-msvc]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: player/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis zip

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: player/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare Windows libmpv runtime
        run: npm run setup:libmpv -- windows

      - name: Build Windows GNU installer
        env:
          OHMYCINE_TMDB_READ_ACCESS_TOKEN: ${{ secrets.OHMYCINE_TMDB_READ_ACCESS_TOKEN }}
          OHMYCINE_DANDANPLAY_APP_ID: ${{ secrets.OHMYCINE_DANDANPLAY_APP_ID }}
          OHMYCINE_DANDANPLAY_APP_SECRET: ${{ secrets.OHMYCINE_DANDANPLAY_APP_SECRET }}
        run: RUSTC="$(rustup which rustc)" npm run tauri:build:windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-windows-gnu
          path: |
            player/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**/*.exe
          retention-days: 30
