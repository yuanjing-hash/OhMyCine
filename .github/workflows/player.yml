name: Player CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**"
      - ".github/workflows/player.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "**"
      - ".github/workflows/player.yml"

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned Android ARM64 debug APK
        run: npm run tauri:build:android:preview

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis zip

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows libmpv runtime
        run: npm run setup:libmpv -- windows

      - name: Build Windows GNU installer
        env:
          OHMYCINE_DANDANPLAY_APP_ID: ${{ secrets.OHMYCINE_DANDANPLAY_APP_ID }}
          OHMYCINE_DANDANPLAY_APP_SECRET: ${{ secrets.OHMYCINE_DANDANPLAY_APP_SECRET }}
        run: RUSTC="$(rustup which rustc)" npm run tauri:build:windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-windows-gnu
          path: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**/*.exe
          retention-days: 30
