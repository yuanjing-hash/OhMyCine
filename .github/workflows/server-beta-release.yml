name: Server Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Server semantic version (X.Y.Z or vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: Validate Server beta request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout requested develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve namespaced Server version
        id: version
        env:
          WORKFLOW_INPUT_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/server_beta_release_guard.py resolve-version "$WORKFLOW_INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Server-only release workflow contract
        run: |
          python3 .github/scripts/server_beta_release_guard.py check-workflow
          python3 .github/scripts/test_server_beta_release_guard.py

      - name: Validate source, tag and release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "::error::Server Beta Release must be dispatched from develop."
            exit 1
          fi

          git fetch --force --prune origin develop
          remote_develop="$(git rev-parse refs/remotes/origin/develop)"
          if [[ "$GITHUB_SHA" != "$remote_develop" ]]; then
            echo "::error::Server beta source must equal the latest origin/develop commit."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git fetch --force origin "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing Server tag does not point to the selected origin/develop tip."
              exit 1
            fi
          fi

          release_title="OhMyCine Server v${VERSION} Beta"
          if release_json="$(gh release view "$TAG_NAME" --json tagName,name,isPrerelease,isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.tagName' <<<"$release_json")" != "$TAG_NAME" ]] ||
               [[ "$(jq -r '.name' <<<"$release_json")" != "$release_title" ]] ||
               [[ "$(jq -r '.isPrerelease' <<<"$release_json")" != "true" ]] ||
               [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]]; then
              echo "::error::Existing Server release must have the exact Server tag/title and be a published prerelease."
              exit 1
            fi
          fi

  release:
    name: Build and publish Server beta assets
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: server-release-${{ needs.resolve.outputs.tag_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: server
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG_NAME: ${{ needs.resolve.outputs.tag_name }}

    steps:
      - name: Checkout selected develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/webui/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            server/go.sum
            server/webui/go.sum

      - name: Build embedded Web UI
        working-directory: server/webui
        run: |
          npm ci
          npm run permissions:check
          npm run test
          npm run typecheck
          npm run lint
          npm run build

      - name: Verify Server
        run: |
          go mod verify
          go build ./...
          go vet ./...
          go test ./...
          cd webui
          go mod verify
          go test .

      - name: Lint Server
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.4.0
          working-directory: server

      - name: Build and package embedded-WebUI Server archives
        env:
          OHMYCINE_TMDB_READ_ACCESS_TOKEN: ${{ secrets.OHMYCINE_TMDB_READ_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OHMYCINE_TMDB_READ_ACCESS_TOKEN:-}" ]]; then
            echo "::error::OHMYCINE_TMDB_READ_ACCESS_TOKEN is required for official Server artifacts."
            exit 1
          fi
          if (( ${#OHMYCINE_TMDB_READ_ACCESS_TOKEN} > 4096 )) || [[ ! "$OHMYCINE_TMDB_READ_ACCESS_TOKEN" =~ ^[A-Za-z0-9._~-]+$ ]]; then
            echo "::error::OHMYCINE_TMDB_READ_ACCESS_TOKEN contains unsupported characters."
            exit 1
          fi

          tmdb_ldflags="-X=github.com/yuanjing-hash/ohmycine/server/pkg/metadata/tmdb.BuiltinReadAccessToken=${OHMYCINE_TMDB_READ_ACCESS_TOKEN}"
          release_root="../dist/server-beta/${TAG_NAME}"
          windows_dir="${release_root}/OhMyCine-Server-v${VERSION}-windows-x64"
          linux_dir="${release_root}/OhMyCine-Server-v${VERSION}-linux-x64"
          mkdir -p "$windows_dir" "$linux_dir"

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags webui -trimpath -ldflags "${tmdb_ldflags} -s -w" -o "${windows_dir}/ohmycine-server.exe" ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags webui -trimpath -ldflags "${tmdb_ldflags} -s -w" -o "${linux_dir}/ohmycine-server" ./cmd/server
          cp README.md "${windows_dir}/README.md"
          cp README.md "${linux_dir}/README.md"
          cp ../LICENSE "${windows_dir}/LICENSE"
          cp ../LICENSE "${linux_dir}/LICENSE"

          windows_asset="OhMyCine-Server-v${VERSION}-windows-x64.zip"
          linux_asset="OhMyCine-Server-v${VERSION}-linux-x64.tar.gz"
          checksums_asset="OhMyCine-Server-v${VERSION}-SHA256SUMS.txt"
          (
            cd "$release_root"
            zip -qr "$windows_asset" "$(basename "$windows_dir")"
            tar -czf "$linux_asset" "$(basename "$linux_dir")"
            sha256sum "$windows_asset" "$linux_asset" > "$checksums_asset"
          )

          echo "WINDOWS_ASSET=${release_root}/${windows_asset}" >> "$GITHUB_ENV"
          echo "LINUX_ASSET=${release_root}/${linux_asset}" >> "$GITHUB_ENV"
          echo "CHECKSUMS_ASSET=${release_root}/${checksums_asset}" >> "$GITHUB_ENV"

      - name: Revalidate latest develop and publish Server-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "::error::Server Beta Release must still be running from develop."
            exit 1
          fi

          # Re-fetch immediately before the first remote mutation so a stale
          # queued build cannot publish after develop has advanced.
          git fetch --force --prune origin develop
          remote_develop="$(git rev-parse refs/remotes/origin/develop)"
          if [[ "$GITHUB_SHA" != "$remote_develop" ]]; then
            echo "::error::origin/develop advanced while Server assets were building; dispatch again from the new tip."
            exit 1
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            tag_exists=true
            git fetch --force origin "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing Server tag does not point to the latest origin/develop commit."
              exit 1
            fi
          fi

          release_exists=false
          release_title="OhMyCine Server v${VERSION} Beta"
          if release_json="$(gh release view "$TAG_NAME" --json tagName,name,isPrerelease,isDraft 2>/dev/null)"; then
            release_exists=true
            if [[ "$(jq -r '.tagName' <<<"$release_json")" != "$TAG_NAME" ]] ||
               [[ "$(jq -r '.name' <<<"$release_json")" != "$release_title" ]] ||
               [[ "$(jq -r '.isPrerelease' <<<"$release_json")" != "true" ]] ||
               [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]]; then
              echo "::error::Existing Server release must have the exact Server tag/title and be a published prerelease."
              exit 1
            fi
          fi

          if [[ "$release_exists" == "false" ]]; then
            create_args=(
              "$TAG_NAME"
              --title "$release_title"
              --notes "OhMyCine Server v${VERSION} Beta. Server-only archives include the embedded Web management UI."
              --prerelease
              --latest=false
            )
            if [[ "$tag_exists" == "true" ]]; then
              create_args+=(--verify-tag)
            else
              create_args+=(--target "$GITHUB_SHA")
            fi
            gh release create "${create_args[@]}"
          fi

          git fetch --force origin "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Published Server tag does not point to the verified develop commit."
            exit 1
          fi
          release_json="$(gh release view "$TAG_NAME" --json tagName,name,isPrerelease,isDraft)"
          if [[ "$(jq -r '.tagName' <<<"$release_json")" != "$TAG_NAME" ]] ||
             [[ "$(jq -r '.name' <<<"$release_json")" != "$release_title" ]] ||
             [[ "$(jq -r '.isPrerelease' <<<"$release_json")" != "true" ]] ||
             [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]]; then
            echo "::error::Server prerelease verification failed."
            exit 1
          fi

          gh release upload "$TAG_NAME" "$WINDOWS_ASSET" "$LINUX_ASSET" "$CHECKSUMS_ASSET" --clobber
