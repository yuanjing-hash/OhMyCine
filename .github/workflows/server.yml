name: Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-beta-release.yml"
      - ".github/scripts/server_beta_release_guard.py"
      - ".github/scripts/test_server_beta_release_guard.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-beta-release.yml"
      - ".github/scripts/server_beta_release_guard.py"
      - ".github/scripts/test_server_beta_release_guard.py"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Verify Server-only beta release contract
        run: |
          python3 .github/scripts/server_beta_release_guard.py check-workflow
          python3 .github/scripts/test_server_beta_release_guard.py

      - name: Check Server scaffold
        id: scaffold
        run: |
          if [ -f go.mod ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Server Go module is not initialized yet; skipping Go checks."
          fi

      - uses: actions/setup-go@v5
        if: steps.scaffold.outputs.ready == 'true'
        with:
          go-version: "1.23"

      - name: Download dependencies
        if: steps.scaffold.outputs.ready == 'true'
        run: go mod download

      - name: Build
        if: steps.scaffold.outputs.ready == 'true'
        run: go build ./...

      - name: Test
        if: steps.scaffold.outputs.ready == 'true'
        run: go test ./...

      - name: Vet
        if: steps.scaffold.outputs.ready == 'true'
        run: go vet ./...

      - name: Lint
        if: steps.scaffold.outputs.ready == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.4.0
          working-directory: server
