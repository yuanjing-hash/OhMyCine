name: Player Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v0.0.6"
        required: true
        default: "v0.0.6"
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - stable
      release_notes:
        description: "Optional extra release notes"
        required: false
        default: ""
  push:
    branches: [develop, main]
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/player-beta-release.yml"
      - ".github/scripts/generate-player-beta-release-notes.py"
      - ".github/scripts/verify-player-release-source.sh"
      - "package.json"
      - "scripts/build-android-preview.mjs"
      - "scripts/setup-libmpv-android.mjs"
      - "scripts/setup-frame-interpolation-model.mjs"
      - "scripts/export-rife-v4.6-flow-mask.py"
      - "scripts/verify-frame-interpolation-contract.ts"
      - "scripts/verify-frame-interpolation-shaders.mjs"
      - "scripts/verify-android-frame-interpolation-native.mjs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/tauri.windows.conf.json"
      - "src-tauri/tauri.updater.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/build.rs"
      - "src-tauri/src/commands/player.rs"
      - "src-tauri/src/commands/player_shared.rs"
      - "src-tauri/src/commands/updater.rs"
      - "src-tauri/src/commands/downloads.rs"
      - "src-tauri/src/commands/download_android.rs"
      - "src-tauri/src/commands/provider_file.rs"
      - "src-tauri/gen/android/app/build.gradle.kts"
      - "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/updater/**"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/downloads/**"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/localmedia/**"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/mpv/**"
      - "src-tauri/gen/android/app/src/main/cpp/**"
      - "src-tauri/gen/android/app/src/main/assets/frame-interpolation/**"
      - "src-tauri/gen/android/app/src/main/assets/resources/frame-interpolation/**"
      - "src-tauri/native/**"
      - "src-tauri/resources/frame-interpolation/**"
      - "src-tauri/src/mpv/frame_interpolation.rs"
      - "src-tauri/src/mpv/windows_frame_interpolation_assets.rs"
      - "src-tauri/src/mpv/player.rs"
      - "src/components/player/FrameInterpolationSettingsContent.vue"
      - "src/services/playerInteractionSettings.ts"
      - "src/composables/useMpv.ts"
      - "src/views/PlayerView.vue"
      - "src-tauri/gen/android/app/src/main/res/xml/file_paths.xml"
      - "src/services/updater.ts"
      - "src/stores/updater.ts"
      - "src/components/layout/UpdateDialog.vue"
      - "src/services/downloads.ts"
      - "src/services/downloadPlanning.ts"
      - "src/components/media/DownloadQueue.vue"
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/player-beta-release.yml"
      - ".github/scripts/generate-player-beta-release-notes.py"
      - ".github/scripts/verify-player-release-source.sh"
      - "package.json"
      - "scripts/build-android-preview.mjs"
      - "scripts/setup-libmpv-android.mjs"
      - "scripts/setup-frame-interpolation-model.mjs"
      - "scripts/export-rife-v4.6-flow-mask.py"
      - "scripts/verify-frame-interpolation-contract.ts"
      - "scripts/verify-frame-interpolation-shaders.mjs"
      - "scripts/verify-android-frame-interpolation-native.mjs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/tauri.windows.conf.json"
      - "src-tauri/tauri.updater.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/build.rs"
      - "src-tauri/src/commands/player.rs"
      - "src-tauri/src/commands/player_shared.rs"
      - "src-tauri/src/commands/updater.rs"
      - "src-tauri/src/commands/downloads.rs"
      - "src-tauri/src/commands/download_android.rs"
      - "src-tauri/src/commands/provider_file.rs"
      - "src-tauri/gen/android/app/build.gradle.kts"
      - "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/updater/**"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/downloads/**"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/localmedia/**"
      - "src-tauri/gen/android/app/src/main/java/com/ohmycine/player/mpv/**"
      - "src-tauri/gen/android/app/src/main/cpp/**"
      - "src-tauri/gen/android/app/src/main/assets/frame-interpolation/**"
      - "src-tauri/gen/android/app/src/main/assets/resources/frame-interpolation/**"
      - "src-tauri/native/**"
      - "src-tauri/resources/frame-interpolation/**"
      - "src-tauri/src/mpv/frame_interpolation.rs"
      - "src-tauri/src/mpv/windows_frame_interpolation_assets.rs"
      - "src-tauri/src/mpv/player.rs"
      - "src/components/player/FrameInterpolationSettingsContent.vue"
      - "src/services/playerInteractionSettings.ts"
      - "src/composables/useMpv.ts"
      - "src/views/PlayerView.vue"
      - "src-tauri/gen/android/app/src/main/res/xml/file_paths.xml"
      - "src/services/updater.ts"
      - "src/stores/updater.ts"
      - "src/components/layout/UpdateDialog.vue"
      - "src/services/downloads.ts"
      - "src/services/downloadPlanning.ts"
      - "src/components/media/DownloadQueue.vue"

permissions:
  contents: read

concurrency:
  group: player-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate workflow dry-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow guardrails
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/player-beta-release.yml')
          text = workflow.read_text()
          manual_version_env = 'WORKFLOW_INPUT_VERSION: ' + '$' + '{{ inputs.version }}'
          manual_channel_env = 'WORKFLOW_INPUT_CHANNEL: ' + '$' + '{{ inputs.channel }}'
          forbidden_direct_version = 'raw_version="' + '$' + '{{ inputs.version }}"'
          release_guard_run = 'run: bash .github/scripts/verify-player-release-source.sh "$RELEASE_CHANNEL" HEAD "$GITHUB_EVENT_NAME" "$GITHUB_REF"'

          required = {
              'release job is gated to manual dispatch or tag push': "if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')" in text,
              'release source helper is used by both release jobs': sum(line.strip() == release_guard_run for line in text.splitlines()) == 2,
              'tag pushes force the beta channel': text.count('release_channel="beta"') >= 3,
              'manual version reaches bash through env': manual_version_env in text,
              'manual channel reaches bash through env': manual_channel_env in text,
              'version resolver reads env instead of direct expression': 'raw_version="${WORKFLOW_INPUT_VERSION:-}"' in text,
              'version sync accepts an already-current Cargo version': 'const cargoVersion = cargo.match' in text and 'Could not find Cargo.toml package version' in text,
              'Windows libmpv setup is present': 'npm run setup:libmpv -- windows' in text,
              'Windows GNU updater build uses rustup rustc': 'npm run tauri:build:windows -- --config src-tauri/tauri.updater.conf.json' in text,
              'updater signing secret is required': 'TAURI_SIGNING_PRIVATE_KEY: $' + '{{ secrets.TAURI_SIGNING_PRIVATE_KEY }}' in text,
              'TMDB application credential is injected into release builds': text.count('OHMYCINE_TMDB_READ_ACCESS_TOKEN: $' + '{{ secrets.OHMYCINE_TMDB_READ_ACCESS_TOKEN }}') >= 2,
              'DanDanPlay credentials are injected into release builds': text.count('OHMYCINE_DANDANPLAY_APP_ID: $' + '{{ secrets.OHMYCINE_DANDANPLAY_APP_ID }}') >= 2 and text.count('OHMYCINE_DANDANPLAY_APP_SECRET: $' + '{{ secrets.OHMYCINE_DANDANPLAY_APP_SECRET }}') >= 2,
              'signed updater manifest is published': 'latest.json' in text and 'setup_signature_asset' in text,
              'release channel controls prerelease': 'RELEASE_CHANNEL' in text and 'release_flags' in text,
              'standard zip asset is published': 'standard_asset="${ASSET_PREFIX}-standard.zip"' in text and 'steps.package.outputs.standard_asset' in text,
              'portable package enables portable mode': 'portable_dir}/portable.flag' in text,
              'publish step remains in release workflow': 'gh release create "$TAG_NAME"' in text,
              'release notes generator is used': 'python3 .github/scripts/generate-player-beta-release-notes.py' in text,
              'release notes are published from generated file': '--notes-file dist/player-beta/release-notes.md' in text,
              'Android ARM64 release job is present': 'release-android-arm64:' in text and 'tauri:build:android:preview' in text,
              'Android clean-runner build avoids pre-generated Gradle bridge': 'gradlew -p src-tauri/gen/android clean' not in Path('package.json').read_text(),
              'Android APK is uploaded to the same release': 'gh release upload "$TAG_NAME" "$ANDROID_APK" "$ANDROID_CHECKSUM" --clobber' in text,
              'Android preview uses a stable signing keystore': 'ANDROID_PREVIEW_KEYSTORE_BASE64' in text and 'OHMYCINE_ANDROID_KEYSTORE' in text,
              'Android updater install permission is declared': 'REQUEST_INSTALL_PACKAGES' in Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml').read_text(),
              'manual extra notes reach generator through env': 'EXTRA_RELEASE_NOTES: $' + '{{ github.event_name == ' + "'workflow_dispatch'" + ' && inputs.release_notes || ' + "''" + ' }}' in text,
          }

          tauri_configs = {
              'base': Path('src-tauri/tauri.conf.json'),
              'windows': Path('src-tauri/tauri.windows.conf.json'),
              'updater': Path('src-tauri/tauri.updater.conf.json'),
          }
          configs = {name: json.loads(path.read_text()) for name, path in tauri_configs.items()}
          resources = {
              name: config.get('bundle', {}).get('resources')
              for name, config in configs.items()
          }
          expected_resources = {
              'windows': {
                  'lib/libmpv-2.dll': 'libmpv-2.dll',
                  'lib/libmpv-wrapper.dll': 'libmpv-wrapper.dll',
                  'lib/frame-interpolation/onnxruntime.dll': 'onnxruntime.dll',
                  'lib/frame-interpolation/onnxruntime_providers_shared.dll': 'onnxruntime_providers_shared.dll',
                  'lib/frame-interpolation/DirectML.dll': 'DirectML.dll',
                  'lib/frame-interpolation/LICENSE-ONNX-RUNTIME': 'FRAME-INTERPOLATION-LICENSE-ONNX-RUNTIME.txt',
                  'lib/frame-interpolation/LICENSE-DIRECTML': 'FRAME-INTERPOLATION-LICENSE-DIRECTML.txt',
                  'lib/frame-interpolation/LICENSE-DIRECTML-CODE': 'FRAME-INTERPOLATION-LICENSE-DIRECTML-CODE.txt',
                  'lib/frame-interpolation/THIRD-PARTY-ONNX-RUNTIME.txt': 'FRAME-INTERPOLATION-THIRD-PARTY-ONNX-RUNTIME.txt',
                  'lib/frame-interpolation/THIRD-PARTY-DIRECTML.txt': 'FRAME-INTERPOLATION-THIRD-PARTY-DIRECTML.txt',
                  'resources/frame-interpolation/model-manifest.json': 'resources/frame-interpolation/model-manifest.json',
                  'resources/frame-interpolation/runtime-manifest.json': 'resources/frame-interpolation/runtime-manifest.json',
                  'resources/frame-interpolation/NOTICE.md': 'resources/frame-interpolation/NOTICE.md',
                  'resources/frame-interpolation/models/rife-v4.6/rife-v4.6-flow-mask.onnx': 'resources/frame-interpolation/models/rife-v4.6/rife-v4.6-flow-mask.onnx',
                  'resources/frame-interpolation/models/rife-v4.6/LICENSE-Practical-RIFE': 'resources/frame-interpolation/models/rife-v4.6/LICENSE-Practical-RIFE',
                  'resources/frame-interpolation/shaders/proxy.hlsl': 'resources/frame-interpolation/shaders/proxy.hlsl',
                  'resources/frame-interpolation/shaders/composite.hlsl': 'resources/frame-interpolation/shaders/composite.hlsl',
                  'lib/LICENSE': 'lib/LICENSE',
                  'resources/shaders/NOTICE.md': 'FSR-NOTICE.md',
              },
          }
          required.update({
              'shared Tauri config has no platform runtime resources': 'resources' not in configs['base'].get('bundle', {}),
              'Windows Tauri resources are Windows-only': resources['windows'] == expected_resources['windows'],
              'Updater release config creates signed artifacts': configs['updater'].get('bundle', {}).get('createUpdaterArtifacts') is True,
              'Updater public key is committed in base config': bool(configs['base'].get('plugins', {}).get('updater', {}).get('pubkey')),
          })

          failed = [name for name, ok in required.items() if not ok]
          if failed:
              for name in failed:
                  print(f'::error::{name}')
              raise SystemExit(1)

          if forbidden_direct_version in text:
              print('::error::inputs.version must not be interpolated directly into a bash run block')
              raise SystemExit(1)
          PY

      - name: Dry-run valid release version and channel parser
        env:
          WORKFLOW_EVENT_NAME: workflow_dispatch
          WORKFLOW_INPUT_VERSION: v0.0.1
          WORKFLOW_INPUT_CHANNEL: beta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$WORKFLOW_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_version="${WORKFLOW_INPUT_VERSION:-}"
            release_channel="${WORKFLOW_INPUT_CHANNEL:-beta}"
          else
            raw_version="${GITHUB_REF_NAME}"
            release_channel="beta"
          fi

          if [[ ! "$raw_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.0.1 or 0.0.1."
            exit 1
          fi

          app_version="${raw_version#v}"
          tag_name="v${app_version}"
          asset_prefix="OhMyCine-Player-${tag_name}-windows-x64"

          test "$app_version" = "0.0.1"
          test "$tag_name" = "v0.0.1"
          test "$asset_prefix" = "OhMyCine-Player-v0.0.1-windows-x64"
          test "$release_channel" = "beta"

      - name: Dry-run release source guardrails
        shell: bash
        run: |
          set -euo pipefail

          guard="${PWD}/.github/scripts/verify-player-release-source.sh"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          bare_repo="${tmp_dir}/origin.git"
          work_repo="${tmp_dir}/work"

          git init -q --bare "$bare_repo"
          git init -q "$work_repo"
          (
            cd "$work_repo"
            git config user.name "OhMyCine Release Dry Run"
            git config user.email "release-dry-run@ohmycine.invalid"
            git remote add origin "$bare_repo"
            git symbolic-ref HEAD refs/heads/main

            empty_tree="$(git mktree </dev/null)"
            stable_sha="$(printf '%s\n\n' 'chore(repo): 稳定版基线' | git commit-tree "$empty_tree")"
            historical_develop_sha="$(printf '%s\n\n' 'feat(player): 历史开发提交' | git commit-tree "$empty_tree" -p "$stable_sha")"
            beta_sha="$(printf '%s\n\n' 'fix(player): 最新开发提交' | git commit-tree "$empty_tree" -p "$historical_develop_sha")"
            feature_sha="$(printf '%s\n\n' 'feat(player): 未合并功能提交' | git commit-tree "$empty_tree" -p "$beta_sha")"
            release_sha="$(printf '%s\n\n' 'chore(player): 发布分支提交' | git commit-tree "$empty_tree" -p "$beta_sha")"
            local_sha="$(printf '%s\n\n' 'fix(player): 本地未推送提交' | git commit-tree "$empty_tree" -p "$beta_sha")"

            git update-ref refs/heads/main "$stable_sha"
            git update-ref refs/heads/develop "$beta_sha"
            git push -q origin main develop

            bash "$guard" beta "$beta_sha" push refs/tags/v0.0.1
            bash "$guard" beta "$beta_sha" workflow_dispatch refs/heads/develop
            bash "$guard" stable "$stable_sha" workflow_dispatch refs/heads/main

            expect_rejection() {
              description="$1"
              channel="$2"
              candidate_sha="$3"
              event_name="${4:-workflow_dispatch}"
              event_ref="${5:-refs/heads/develop}"
              if bash "$guard" "$channel" "$candidate_sha" "$event_name" "$event_ref"; then
                echo "::error::${description} unexpectedly passed the release source guard."
                exit 1
              fi
            }

            expect_rejection "main commit used for beta" beta "$stable_sha"
            expect_rejection "develop commit used for stable" stable "$beta_sha" workflow_dispatch refs/heads/main
            expect_rejection "historical develop commit" beta "$historical_develop_sha"
            expect_rejection "unmerged feature branch commit" beta "$feature_sha"
            expect_rejection "release branch commit" beta "$release_sha"
            expect_rejection "local unpushed commit" beta "$local_sha"
            expect_rejection "manual beta from feature ref" beta "$beta_sha" workflow_dispatch refs/heads/feature/example
            expect_rejection "manual stable from develop ref" stable "$stable_sha" workflow_dispatch refs/heads/develop
            expect_rejection "stable tag push" stable "$stable_sha" push refs/tags/v1.0.0
          )

      - name: Dry-run release notes generator
        shell: bash
        run: |
          set -euo pipefail

          script_path="${PWD}/.github/scripts/generate-player-beta-release-notes.py"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export GIT_AUTHOR_NAME="OhMyCine CI"
          export GIT_AUTHOR_EMAIL="ci@ohmycine.local"
          export GIT_COMMITTER_NAME="OhMyCine CI"
          export GIT_COMMITTER_EMAIL="ci@ohmycine.local"

          (
            cd "$tmp_dir"
            git init -q
            git symbolic-ref HEAD refs/heads/main

            empty_tree="$(git mktree </dev/null)"
            commit_one="$(printf '%s\n\n' 'chore(repo): 初始化项目' | git commit-tree "$empty_tree")"
            git update-ref refs/heads/main "$commit_one"
            git tag v0.0.1 "$commit_one"

            commit_two="$(printf '%s\n\n' 'feat(player): 添加海报墙入口' | git commit-tree "$empty_tree" -p "$commit_one")"
            git update-ref refs/heads/main "$commit_two"
            commit_three="$(printf '%s\n\n' 'fix(player): 修复便携包校验' | git commit-tree "$empty_tree" -p "$commit_two")"
            git update-ref refs/heads/main "$commit_three"
            commit_four="$(printf '%s\n\n' 'docs: 更新 beta 发版说明' | git commit-tree "$empty_tree" -p "$commit_three")"
            git update-ref refs/heads/main "$commit_four"
            commit_five="$(printf '%s\n\n' 'build: 调整临时构建脚本' | git commit-tree "$empty_tree" -p "$commit_four")"
            git update-ref refs/heads/main "$commit_five"

            TAG_NAME=v0.0.2 \
              ASSET_PREFIX=OhMyCine-Player-v0.0.2-windows-x64 \
              WORKFLOW_EVENT_NAME=workflow_dispatch \
              EXTRA_RELEASE_NOTES='手动补充说明' \
              OUTPUT_PATH=notes.md \
              python3 "$script_path"

            grep -Fq 'Range: `v0.0.1..v0.0.2`.' notes.md
            grep -Fq '### feat' notes.md
            grep -Fq -- '- feat(player): 添加海报墙入口 (' notes.md
            grep -Fq '### fix' notes.md
            grep -Fq '### docs' notes.md
            grep -Fq '### other' notes.md
            grep -Fq '## Extra Notes' notes.md
            grep -Fq '手动补充说明' notes.md
            grep -Fq 'OhMyCine-Player-v0.0.2-windows-x64-standard.zip' notes.md
            grep -Fq 'OhMyCine-Player-v0.0.2-windows-x64-portable.zip' notes.md
            grep -Fq 'OhMyCine-Player-v0.0.2-android-arm64.apk' notes.md
            grep -Fq 'OhMyCine-Player-v0.0.2-android-arm64.sha256' notes.md
            grep -Fq 'OhMyCine-Player-v0.0.2-windows-x64.sha256' notes.md
            if grep -Eiq 'GITHUB_TOKEN|GH_TOKEN|GITHUB_ENV|SECRET|AUTHORIZATION|COOKIE|PASSKEY' notes.md; then
              echo "::error::Release notes must not contain sensitive environment variable names."
              exit 1
            fi
          )

          (
            cd "$tmp_dir"
            rm -rf no-tags
            mkdir no-tags
            cd no-tags
            git init -q
            git symbolic-ref HEAD refs/heads/main

            empty_tree="$(git mktree </dev/null)"
            initial_commit="$(printf '%s\n\n' 'ci(player): 初始化 beta 校验' | git commit-tree "$empty_tree")"
            git update-ref refs/heads/main "$initial_commit"

            TAG_NAME=v0.0.1 \
              WORKFLOW_EVENT_NAME=push \
              EXTRA_RELEASE_NOTES='should not be included' \
              OUTPUT_PATH=notes.md \
              python3 "$script_path"

            grep -Fq 'Range: `initial commit..v0.0.1`.' notes.md
            grep -Fq '### ci' notes.md
            if grep -Eiq 'GITHUB_TOKEN|GH_TOKEN|GITHUB_ENV|SECRET|AUTHORIZATION|COOKIE|PASSKEY' notes.md; then
              echo "::error::Release notes must not contain sensitive environment variable names."
              exit 1
            fi
            if grep -Fq '## Extra Notes' notes.md; then
              echo "::error::Push/tag release notes must not include manual extra notes."
              exit 1
            fi
          )

      - name: Dry-run invalid beta version rejection
        env:
          WORKFLOW_EVENT_NAME: workflow_dispatch
          WORKFLOW_INPUT_VERSION: beta/0.0.1
        shell: bash
        run: |
          set -euo pipefail

          raw_version="${WORKFLOW_INPUT_VERSION:-}"
          if [[ "$raw_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version unexpectedly passed validation."
            exit 1
          fi

  release-android-arm64:
    name: Build and publish Android ARM64 preview
    needs:
      - validate
      - release-windows-msvc
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Android release version
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_INPUT_CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_version="${WORKFLOW_INPUT_VERSION:-}"
            release_channel="${WORKFLOW_INPUT_CHANNEL:-beta}"
          else
            raw_version="${GITHUB_REF_NAME}"
            release_channel="beta"
          fi
          if [[ ! "$raw_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.0.1 or 0.0.1."
            exit 1
          fi
          app_version="${raw_version#v}"
          if [[ "$release_channel" != "beta" && "$release_channel" != "stable" ]]; then
            echo "::error::Release channel must be beta or stable."
            exit 1
          fi
          {
            echo "APP_VERSION=${app_version}"
            echo "TAG_NAME=v${app_version}"
            echo "RELEASE_CHANNEL=${release_channel}"
            echo "ANDROID_APK=dist/android/OhMyCine-Player-v${app_version}-android-arm64.apk"
            echo "ANDROID_CHECKSUM=dist/android/OhMyCine-Player-v${app_version}-android-arm64.sha256"
          } >> "$GITHUB_ENV"

      - name: Verify release source
        shell: bash
        run: bash .github/scripts/verify-player-release-source.sh "$RELEASE_CHANNEL" HEAD "$GITHUB_EVENT_NAME" "$GITHUB_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci

      - name: Prepare Android interpolation runtime
        working-directory: .
        run: npm run setup:libmpv:android

      - name: Verify frame-interpolation contracts and Android native backend
        working-directory: .
        run: |
          npm run verify:frame-interpolation
          npm run verify:frame-interpolation:android-native

      - name: Sync Player version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.APP_VERSION

          function writeJson(path, update) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'))
            update(data)
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`)
          }

          writeJson('package.json', data => { data.version = version })
          writeJson('package-lock.json', data => {
            data.version = version
            if (data.packages?.['']) data.packages[''].version = version
          })
          writeJson('src-tauri/tauri.conf.json', data => { data.version = version })
          const cargoPath = 'src-tauri/Cargo.toml'
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargo.replace(/^version = "[^"]+"/m, `version = "${version}"`))
          NODE

      - name: Configure stable Android preview signing
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_PREVIEW_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_PREVIEW_KEYSTORE_BASE64 GitHub Secret is required for upgrade-compatible Android APKs."
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/ohmycine-preview.jks"
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "OHMYCINE_ANDROID_KEYSTORE=${keystore_path}" >> "$GITHUB_ENV"

      - name: Build Android ARM64 APK
        env:
          OHMYCINE_TMDB_READ_ACCESS_TOKEN: ${{ secrets.OHMYCINE_TMDB_READ_ACCESS_TOKEN }}
          OHMYCINE_DANDANPLAY_APP_ID: ${{ secrets.OHMYCINE_DANDANPLAY_APP_ID }}
          OHMYCINE_DANDANPLAY_APP_SECRET: ${{ secrets.OHMYCINE_DANDANPLAY_APP_SECRET }}
          OHMYCINE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
          OHMYCINE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          OHMYCINE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for value in OHMYCINE_TMDB_READ_ACCESS_TOKEN OHMYCINE_DANDANPLAY_APP_ID OHMYCINE_DANDANPLAY_APP_SECRET OHMYCINE_ANDROID_KEYSTORE_PASSWORD OHMYCINE_ANDROID_KEY_ALIAS OHMYCINE_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "::error::${value} GitHub Secret is required for the Android release build."
              exit 1
            fi
          done
          npm run tauri:build:android:preview

      - name: Package Android asset
        shell: bash
        run: |
          set -euo pipefail
          source_apk="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$source_apk"
          mkdir -p dist/android
          cp "$source_apk" "$ANDROID_APK"
          sha256sum "$ANDROID_APK" > "$ANDROID_CHECKSUM"

      - name: Upload Android workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyCine-Player-${{ env.TAG_NAME }}-android-arm64
          path: |
            ${{ env.ANDROID_APK }}
            ${{ env.ANDROID_CHECKSUM }}
          retention-days: 30

      - name: Upload Android assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" "$ANDROID_APK" "$ANDROID_CHECKSUM" --clobber

  release-windows-msvc:
    name: Build and publish Windows release
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_INPUT_CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$WORKFLOW_EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_version="${WORKFLOW_INPUT_VERSION:-}"
            release_channel="${WORKFLOW_INPUT_CHANNEL:-beta}"
          else
            raw_version="${GITHUB_REF_NAME}"
            release_channel="beta"
          fi

          if [[ ! "$raw_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.0.1 or 0.0.1."
            exit 1
          fi

          app_version="${raw_version#v}"
          tag_name="v${app_version}"
          asset_prefix="OhMyCine-Player-${tag_name}-windows-x64"
          if [[ "$release_channel" != "beta" && "$release_channel" != "stable" ]]; then
            echo "::error::Release channel must be beta or stable."
            exit 1
          fi

          {
            echo "app_version=${app_version}"
            echo "tag_name=${tag_name}"
            echo "asset_prefix=${asset_prefix}"
            echo "release_channel=${release_channel}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "APP_VERSION=${app_version}"
            echo "TAG_NAME=${tag_name}"
            echo "ASSET_PREFIX=${asset_prefix}"
            echo "RELEASE_CHANNEL=${release_channel}"
          } >> "$GITHUB_ENV"

      - name: Verify release source
        shell: bash
        run: bash .github/scripts/verify-player-release-source.sh "$RELEASE_CHANNEL" HEAD "$GITHUB_EVENT_NAME" "$GITHUB_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Sync Player version
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs')

          const version = process.env.APP_VERSION
          if (!version)
            throw new Error('APP_VERSION is required')

          function writeJson(path, update) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'))
            update(data)
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`)
          }

          writeJson('package.json', data => {
            data.version = version
          })

          writeJson('package-lock.json', data => {
            data.version = version
            if (data.packages?.[''])
              data.packages[''].version = version
          })

          writeJson('src-tauri/tauri.conf.json', data => {
            data.version = version
          })

          const cargoPath = 'src-tauri/Cargo.toml'
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          const cargoVersion = cargo.match(/^version = "([^"]+)"/m)
          if (!cargoVersion)
            throw new Error('Could not find Cargo.toml package version')
          const updatedCargo = cargo.replace(/^version = "[^"]+"/m, `version = "${version}"`)
          fs.writeFileSync(cargoPath, updatedCargo)
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Windows packaging tools
        shell: pwsh
        run: choco install zip -y --no-progress

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci

      - name: Verify frame-interpolation contracts
        working-directory: .
        run: npm run verify:frame-interpolation

      - name: Prepare Windows libmpv runtime
        working-directory: .
        run: npm run setup:libmpv -- windows

      - name: Build Windows MSVC installer
        env:
          OHMYCINE_TMDB_READ_ACCESS_TOKEN: ${{ secrets.OHMYCINE_TMDB_READ_ACCESS_TOKEN }}
          OHMYCINE_DANDANPLAY_APP_ID: ${{ secrets.OHMYCINE_DANDANPLAY_APP_ID }}
          OHMYCINE_DANDANPLAY_APP_SECRET: ${{ secrets.OHMYCINE_DANDANPLAY_APP_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY GitHub Secret is required for signed updater artifacts."
            exit 1
          fi
          if [[ -z "${OHMYCINE_TMDB_READ_ACCESS_TOKEN:-}" ]]; then
            echo "::error::OHMYCINE_TMDB_READ_ACCESS_TOKEN GitHub Secret is required for the default TMDB metadata channel."
            exit 1
          fi
          if [[ -z "${OHMYCINE_DANDANPLAY_APP_ID:-}" || -z "${OHMYCINE_DANDANPLAY_APP_SECRET:-}" ]]; then
            echo "::error::DanDanPlay AppId/AppSecret GitHub Secrets are required for the default official danmaku service."
            exit 1
          fi
          npm run tauri:build:windows:native -- --config src-tauri/tauri.updater.conf.json

      - name: Package release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_dir="src-tauri/target/${TARGET}/release"
          bundle_dir="${release_dir}/bundle/nsis"
          dist_dir="dist/player-beta"
          standard_root="dist/standard"
          standard_dir="${standard_root}/${ASSET_PREFIX}"
          portable_root="dist/portable"
          portable_dir="${portable_root}/${ASSET_PREFIX}"
          setup_asset="${ASSET_PREFIX}-setup.exe"
          setup_signature_asset="${setup_asset}.sig"
          standard_asset="${ASSET_PREFIX}-standard.zip"
          portable_asset="${ASSET_PREFIX}-portable.zip"
          checksum_asset="${ASSET_PREFIX}.sha256"

          test -d "$release_dir"
          test -d "$bundle_dir"
          mkdir -p "$dist_dir" "$standard_dir" "$portable_dir"

          setup_source="$(find "$bundle_dir" -maxdepth 1 -type f -name '*setup.exe' | sort | head -n 1)"
          if [[ -z "$setup_source" ]]; then
            echo "::error::No NSIS setup executable found under ${bundle_dir}."
            exit 1
          fi
          cp "$setup_source" "${dist_dir}/${setup_asset}"
          if [[ ! -f "${setup_source}.sig" ]]; then
            echo "::error::Signed NSIS updater artifact is missing: ${setup_source}.sig"
            exit 1
          fi
          cp "${setup_source}.sig" "${dist_dir}/${setup_signature_asset}"

          for file in ohmycine-player.exe WebView2Loader.dll libmpv-wrapper.dll libmpv-2.dll; do
            if [[ ! -f "${release_dir}/${file}" ]]; then
              echo "::error::Required Windows runtime file is missing: ${release_dir}/${file}"
              exit 1
            fi
            cp "${release_dir}/${file}" "${standard_dir}/${file}"
            cp "${release_dir}/${file}" "${portable_dir}/${file}"
          done
          for file in onnxruntime.dll onnxruntime_providers_shared.dll DirectML.dll; do
            source="src-tauri/lib/frame-interpolation/${file}"
            test -f "$source"
            cp "$source" "${standard_dir}/${file}"
            cp "$source" "${portable_dir}/${file}"
          done
          framegen_resource_dir="resources/frame-interpolation"
          for destination in "${standard_dir}" "${portable_dir}"; do
            mkdir -p "${destination}/${framegen_resource_dir}/models/rife-v4.6" "${destination}/${framegen_resource_dir}/shaders"
            cp src-tauri/resources/frame-interpolation/model-manifest.json "${destination}/${framegen_resource_dir}/"
            cp src-tauri/resources/frame-interpolation/runtime-manifest.json "${destination}/${framegen_resource_dir}/"
            cp src-tauri/resources/frame-interpolation/NOTICE.md "${destination}/${framegen_resource_dir}/"
            cp src-tauri/resources/frame-interpolation/models/rife-v4.6/rife-v4.6-flow-mask.onnx "${destination}/${framegen_resource_dir}/models/rife-v4.6/"
            cp src-tauri/resources/frame-interpolation/models/rife-v4.6/LICENSE-Practical-RIFE "${destination}/${framegen_resource_dir}/models/rife-v4.6/"
            cp src-tauri/resources/frame-interpolation/shaders/proxy.hlsl "${destination}/${framegen_resource_dir}/shaders/"
            cp src-tauri/resources/frame-interpolation/shaders/composite.hlsl "${destination}/${framegen_resource_dir}/shaders/"
          done
          while read -r source_name destination_name; do
            source="src-tauri/lib/frame-interpolation/${source_name}"
            test -f "$source"
            cp "$source" "${standard_dir}/${destination_name}"
            cp "$source" "${portable_dir}/${destination_name}"
          done <<'FRAMEGEN_LICENSES'
          LICENSE-ONNX-RUNTIME FRAME-INTERPOLATION-LICENSE-ONNX-RUNTIME.txt
          LICENSE-DIRECTML FRAME-INTERPOLATION-LICENSE-DIRECTML.txt
          LICENSE-DIRECTML-CODE FRAME-INTERPOLATION-LICENSE-DIRECTML-CODE.txt
          THIRD-PARTY-ONNX-RUNTIME.txt FRAME-INTERPOLATION-THIRD-PARTY-ONNX-RUNTIME.txt
          THIRD-PARTY-DIRECTML.txt FRAME-INTERPOLATION-THIRD-PARTY-DIRECTML.txt
          FRAMEGEN_LICENSES
          printf 'OhMyCine portable mode\n' > "${portable_dir}/portable.flag"

          if [[ -f "src-tauri/lib/LICENSE" ]]; then
            cp "src-tauri/lib/LICENSE" "${standard_dir}/THIRD-PARTY-LICENSES.txt"
            cp "src-tauri/lib/LICENSE" "${portable_dir}/THIRD-PARTY-LICENSES.txt"
          fi
          cp "src-tauri/resources/shaders/NOTICE.md" "${standard_dir}/FSR-NOTICE.md"
          cp "src-tauri/resources/shaders/NOTICE.md" "${portable_dir}/FSR-NOTICE.md"

          test ! -e "${standard_dir}/portable.flag"
          test -f "${portable_dir}/portable.flag"
          for generated_dir in data cache logs; do
            test ! -e "${standard_dir}/${generated_dir}"
            test ! -e "${portable_dir}/${generated_dir}"
          done

          (cd "$standard_root" && zip -r "../player-beta/${standard_asset}" "${ASSET_PREFIX}")
          (cd "$portable_root" && zip -r "../player-beta/${portable_asset}" "${ASSET_PREFIX}")
          (cd "$dist_dir" && sha256sum "$setup_asset" "$setup_signature_asset" "$standard_asset" "$portable_asset" > "$checksum_asset")

          {
            echo "dist_dir=${dist_dir}"
            echo "setup_asset=${dist_dir}/${setup_asset}"
            echo "setup_signature_asset=${dist_dir}/${setup_signature_asset}"
            echo "standard_asset=${dist_dir}/${standard_asset}"
            echo "portable_asset=${dist_dir}/${portable_asset}"
            echo "checksum_asset=${dist_dir}/${checksum_asset}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          EXTRA_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.release_channel }}
          OUTPUT_PATH: dist/player-beta/release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generate-player-beta-release-notes.py

      - name: Generate signed updater manifest
        env:
          SETUP_ASSET: ${{ steps.package.outputs.setup_asset }}
          SETUP_SIGNATURE_ASSET: ${{ steps.package.outputs.setup_signature_asset }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          setup_path = Path(os.environ['SETUP_ASSET'])
          signature_path = Path(os.environ['SETUP_SIGNATURE_ASSET'])
          signature = signature_path.read_text(encoding='utf-8').strip()
          if not signature:
              raise SystemExit('Updater signature is empty')

          notes_path = Path('dist/player-beta/release-notes.md')
          manifest = {
              'version': os.environ['APP_VERSION'],
              'notes': notes_path.read_text(encoding='utf-8'),
              'pub_date': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': {
                  'windows-x86_64': {
                      'signature': signature,
                      'url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG_NAME']}/{setup_path.name}",
                  },
              },
          }
          Path('dist/player-beta/latest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset_prefix }}
          path: |
            ${{ steps.package.outputs.setup_asset }}
            ${{ steps.package.outputs.setup_signature_asset }}
            ${{ steps.package.outputs.standard_asset }}
            ${{ steps.package.outputs.portable_asset }}
            ${{ steps.package.outputs.checksum_asset }}
            dist/player-beta/latest.json
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            "${{ steps.package.outputs.setup_asset }}"
            "${{ steps.package.outputs.setup_signature_asset }}"
            "${{ steps.package.outputs.standard_asset }}"
            "${{ steps.package.outputs.portable_asset }}"
            "${{ steps.package.outputs.checksum_asset }}"
            "dist/player-beta/latest.json"
          )

          release_title="OhMyCine Player ${TAG_NAME}"
          release_flags=()
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            release_title="${release_title} Beta"
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--prerelease=false --latest)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            gh release edit "$TAG_NAME" \
              --title "$release_title" \
              --notes-file dist/player-beta/release-notes.md \
              "${release_flags[@]}"
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$release_title" \
              --notes-file dist/player-beta/release-notes.md \
              --target "$GITHUB_SHA" \
              "${release_flags[@]}"
          fi
